palette = "catppuccin_mocha"
add_newline = true

# The backslash at the end of each line ensures NO extra spaces are added,
# mimicking Nix's lib.concatStrings exactly.
format = """
([](white)${custom.git_config_email}$git_branch[](white))\
$line_break\
$directory\
$python\
$nodejs\
$rust\
$golang\
$lua\
$php\
$java\
$kotlin\
$haskell\
$elixir\
$elm\
$ruby\
$perl\
$c\
$cpp\
$cmake\
$zig\
$nim\
$dart\
$swift\
$docker_context\
$terraform\
$nix_shell\
$package\
$git_status\
$line_break\
$character"""

[custom.git_config_email]
command = "git config user.email"
format = "[ $output](bg:white fg:0 bold)"
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"

[git_branch]
symbol = "󰊢 "
style = "bg:white fg:0 bold"
format = "[[ on ](bg:white fg:8)$symbol$branch]($style)"

[git_status]
style = "status"

[directory]
truncation_length = 1
read_only = " 🔒"
style = "blue"
format = "[󰝰 $path]($style)[$read_only]($read_only_style) "

[python]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold #3776AB"

[nodejs]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold #339933"

[rust]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold #CE412B"

[golang]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold #00ADD8"

[lua]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold #000080"

[php]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold #777BB4"

[java]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold #ED8B00"

[kotlin]
symbol = "󱈙 "
format = "[$symbol($version)]($style) "
style = "bold #7F52FF"

[haskell]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold #5D4F85"

[elixir]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold #4E2A8E"

[elm]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold #60B5CC"

[ruby]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold #CC342D"

[perl]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold #39457E"

[c]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold #A8B9CC"

[cpp]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold #00599C"

[cmake]
symbol = "󰔊 "
format = "[$symbol($version)]($style) "
style = "bold #064F8C"

[zig]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold #F7A41D"

[nim]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold #FFE953"

[dart]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold #0175C2"

[swift]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold #F05138"

[docker_context]
symbol = "󰡨 "
format = "[$symbol($context)]($style) "
style = "bold #2496ED"

[terraform]
symbol = "󱁢 "
format = "[$symbol($version)]($style) "
style = "bold #844FBA"

[nix_shell]
symbol = " "
format = "[$symbol($state)]($style) "
style = "bold #7EBAE4"

[package]
symbol = "󰏗 "
format = "[$symbol($version)]($style) "
style = "bold #F2BF26"

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

